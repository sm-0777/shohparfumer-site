<!doctype html>
<!-- Картинка для превью ссылки (Telegram, WhatsApp): 1200×630. Собирается в public/og.png командой из README. -->
<html lang="ru">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&family=Unbounded:wght@500;600&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; background: #0B0B0A; color: #F5F2E9; font-family: "Onest", system-ui, sans-serif; overflow: hidden; position: relative; }
  .in { position: absolute; inset: 72px 80px; display: flex; flex-direction: column; }
  .dots { display: flex; gap: 14px; margin-bottom: 40px; }
  .dots i { width: 26px; height: 26px; border-radius: 50%; background: #FFC61A; display: block; }
  .dots i:nth-child(2) { opacity: .65; } .dots i:nth-child(3) { opacity: .35; }
  h1 { margin: 0; font-family: "Unbounded", system-ui, sans-serif; font-weight: 600; font-size: 84px; line-height: 1.05; letter-spacing: -0.01em; }
  .sub { margin-top: 18px; font-weight: 600; font-size: 30px; letter-spacing: 0.08em; text-transform: uppercase; color: #FFC61A; }
  .lead { margin-top: auto; font-size: 34px; line-height: 1.35; color: #D8D4C7; max-width: 640px; }
  .lead b { color: #F5F2E9; font-weight: 600; }
  .langs { margin-top: 22px; font-size: 24px; font-weight: 600; letter-spacing: 0.06em; color: #A8A496; }
  .bottles { position: absolute; right: 70px; bottom: 60px; display: flex; align-items: flex-end; gap: 22px; }
  .bottles svg { display: block; }
</style>
</head>
<body>
  <div class="in">
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1>Shoh Parfumer</h1>
    <div class="sub">Подбор парфюма</div>
    <p class="lead"><b>3 любимых аромата → 5 новых.</b><br>Дюпы, ноты, советы — за минуту.</p>
    <div class="langs">RU · TJ · EN</div>
  </div>
  <!-- Флаконы нарисованы обобщённо (как на сайте), это не флаконы брендов -->

  </div>
